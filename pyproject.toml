[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivado-mcp-native"
version = "0.2.1"
description = "Native cross-platform MCP server for AMD/Xilinx Vivado FPGA development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Arthurzxy"}
]
keywords = ["mcp", "mcp-server", "vivado", "fpga", "xilinx", "amd", "eda", "tcl", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp>=1.0.0",
    "psutil>=5.9.0",
    "typing-extensions>=4.6",
]

[project.scripts]
vivado-mcp-native = "vivado_mcp:main"
vivado-mcp-native-doctor = "vivado_mcp.doctor:main"
vivado-mcp-win = "vivado_mcp:main"
vivado-mcp-win-doctor = "vivado_mcp.doctor:main"

[project.urls]
Homepage = "https://github.com/Arthurzxy/vivado_mcp_native"
Repository = "https://github.com/Arthurzxy/vivado_mcp_native"
Issues = "https://github.com/Arthurzxy/vivado_mcp_native/issues"
"MCP Registry" = "https://registry.modelcontextprotocol.io/?q=io.github.Arthurzxy%2Fvivado-mcp-native"

[tool.setuptools]
packages = ["vivado_mcp"]
package-dir = {"vivado_mcp" = "."}

[tool.setuptools.package-data]
vivado_mcp = ["data/*.json"]