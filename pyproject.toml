[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivado-mcp"
version = "0.2.0"
description = "Cross-platform MCP server for AMD/Xilinx Vivado FPGA development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Created with Claude", email = "noreply@anthropic.com"}
]
keywords = ["mcp", "vivado", "fpga", "xilinx", "amd", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
vivado-mcp = "vivado_mcp:main"

[project.urls]
Homepage = "https://github.com/coreyhahn/vivado_mcp"
Repository = "https://github.com/coreyhahn/vivado_mcp"
Issues = "https://github.com/coreyhahn/vivado_mcp/issues"

[tool.setuptools]
packages = ["vivado_mcp"]
package-dir = {"vivado_mcp" = "."}

[tool.setuptools.package-data]
vivado_mcp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"vivado_session.py" = ["BLE001", "DTZ005"]
