name: MCP Registry publisher diagnostic

on:
  pull_request:
    branches: [master]
    paths:
      - .release/0.2.1.pr-trigger

jobs:
  publish-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Capture publisher output
        id: publish
        shell: bash
        run: |
          set +e
          ./mcp-publisher publish >mcp-publisher.log 2>&1
          code=$?
          echo "exit_code=${code}" >mcp-publisher-status.txt
          echo "Publisher exit code: ${code}"
          exit 0

      - name: Upload complete publisher diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: mcp-publisher-diagnostic
          path: |
            server.json
            README.md
            mcp-publisher.log
            mcp-publisher-status.txt
          if-no-files-found: error
