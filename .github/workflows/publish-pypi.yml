name: Publish package and MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .release/0.2.1.trigger
  pull_request:
    branches: [master]
    paths:
      - .release/0.2.1.pr-trigger

concurrency:
  group: package-publish-verified-0.2.1
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import tomllib

          expected = "0.2.1"
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          server = json.loads(pathlib.Path("server.json").read_text(encoding="utf-8"))
          init_text = pathlib.Path("__init__.py").read_text(encoding="utf-8")
          module_version = re.search(r'__version__\s*=\s*"([^"]+)"', init_text).group(1)
          values = {
              "pyproject": project["project"]["version"],
              "module": module_version,
              "server": server["version"],
              "package": server["packages"][0]["version"],
          }
          assert all(value == expected for value in values.values()), values
          assert server["name"] == "io.github.Arthurzxy/vivado-mcp-native"
          assert server["packages"][0]["identifier"] == "vivado-mcp-native"
          assert "mcp-name: io.github.Arthurzxy/vivado-mcp-native" in pathlib.Path("README.md").read_text(encoding="utf-8")
          print(values)
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Ensure PyPI and MCP Registry publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vivado-mcp-native
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether PyPI 0.2.1 exists
        id: pypi
        shell: bash
        run: |
          if curl --fail --silent --show-error https://pypi.org/pypi/vivado-mcp-native/0.2.1/json >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PyPI 0.2.1 already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "PyPI 0.2.1 requires publishing."
          fi

      - name: Download distributions
        if: steps.pypi.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Wait for PyPI propagation
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error https://pypi.org/pypi/vivado-mcp-native/0.2.1/json >/dev/null && exit 0
            echo "Waiting for PyPI propagation ($attempt/30)..."
            sleep 10
          done
          exit 1

      - name: Check whether MCP Registry 0.2.1 exists
        id: registry
        shell: bash
        run: |
          response="$(curl --silent --show-error --get --data-urlencode 'search=io.github.Arthurzxy/vivado-mcp-native' https://registry.modelcontextprotocol.io/v0.1/servers || true)"
          if printf '%s' "$response" | jq -e --arg name 'io.github.Arthurzxy/vivado-mcp-native' --arg version '0.2.1' '.. | objects | select(.name? == $name and .version? == $version)' >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "MCP Registry 0.2.1 already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "MCP Registry 0.2.1 requires publishing."
          fi

      - name: Install mcp-publisher
        if: steps.registry.outputs.exists != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        id: registry_publish
        continue-on-error: true
        run: ./mcp-publisher publish

      - name: Wait for MCP Registry propagation
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --get --data-urlencode 'search=io.github.Arthurzxy/vivado-mcp-native' https://registry.modelcontextprotocol.io/v0.1/servers || true)"
            if printf '%s' "$response" | jq -e --arg name 'io.github.Arthurzxy/vivado-mcp-native' --arg version '0.2.1' '.. | objects | select(.name? == $name and .version? == $version)' >/dev/null; then
              echo "MCP Registry 0.2.1 is available."
              exit 0
            fi
            echo "Waiting for MCP Registry propagation ($attempt/30)..."
            sleep 10
          done
          echo "Registry publisher outcome: ${{ steps.registry_publish.outcome }}"
          exit 1

  report:
    name: Report release result
    if: always()
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Probe and report public endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: bash
        run: |
          pypi="not-visible"
          registry="not-visible"

          if curl --fail --silent --show-error https://pypi.org/pypi/vivado-mcp-native/0.2.1/json >/dev/null; then
            pypi="visible"
          fi

          response="$(curl --silent --show-error --get --data-urlencode 'search=io.github.Arthurzxy/vivado-mcp-native' https://registry.modelcontextprotocol.io/v0.1/servers || true)"
          if printf '%s' "$response" | jq -e --arg name 'io.github.Arthurzxy/vivado-mcp-native' --arg version '0.2.1' '.. | objects | select(.name? == $name and .version? == $version)' >/dev/null; then
            registry="visible"
          fi

          body=$(cat <<EOF
          ## 0.2.1 release automation result

          - Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Build job: ${BUILD_RESULT}
          - Publication job: ${PUBLISH_RESULT}
          - PyPI public endpoint: ${pypi}
          - MCP Registry public endpoint: ${registry}

          Links:
          - PyPI: https://pypi.org/project/vivado-mcp-native/0.2.1/
          - MCP Registry: https://registry.modelcontextprotocol.io/?q=io.github.Arthurzxy%2Fvivado-mcp-native
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

          test "$pypi" = "visible"
          test "$registry" = "visible"
