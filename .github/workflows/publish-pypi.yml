name: Publish package and MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .release/0.2.1.trigger
  pull_request:
    branches: [master]
    paths:
      - .release/0.2.1.pr-trigger

concurrency:
  group: package-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify release versions are aligned
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import tomllib

          expected = "0.2.1"
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          server = json.loads(pathlib.Path("server.json").read_text(encoding="utf-8"))
          init_text = pathlib.Path("__init__.py").read_text(encoding="utf-8")
          module_version = re.search(r'__version__\s*=\s*"([^"]+)"', init_text).group(1)

          values = {
              "pyproject": project["project"]["version"],
              "module": module_version,
              "server": server["version"],
              "package": server["packages"][0]["version"],
          }
          if any(value != expected for value in values.values()):
              raise SystemExit(f"Version mismatch: {values}")
          if server["name"] != "io.github.Arthurzxy/vivado-mcp-native":
              raise SystemExit("Unexpected MCP Registry server name")
          print(values)
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Ensure version 0.2.1 is on PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/vivado-mcp-native

    permissions:
      id-token: write

    steps:
      - name: Check whether PyPI 0.2.1 already exists
        id: pypi
        shell: bash
        run: |
          if curl --fail --silent --show-error \
            https://pypi.org/pypi/vivado-mcp-native/0.2.1/json \
            >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PyPI version 0.2.1 already exists; upload will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "PyPI version 0.2.1 is not visible yet; upload is required."
          fi

      - name: Download distributions
        if: steps.pypi.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Confirm PyPI version 0.2.1
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              https://pypi.org/pypi/vivado-mcp-native/0.2.1/json \
              >/dev/null; then
              echo "PyPI version 0.2.1 is available."
              exit 0
            fi
            echo "Waiting for PyPI propagation ($attempt/30)..."
            sleep 10
          done
          echo "PyPI version 0.2.1 did not become available in time."
          exit 1

  publish-registry:
    name: Ensure metadata is in the official MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether Registry version 0.2.1 already exists
        id: registry
        shell: bash
        run: |
          response="$(curl --silent --show-error --get \
            --data-urlencode 'search=io.github.Arthurzxy/vivado-mcp-native' \
            https://registry.modelcontextprotocol.io/v0.1/servers || true)"
          if printf '%s' "$response" | jq -e \
            --arg name 'io.github.Arthurzxy/vivado-mcp-native' \
            --arg version '0.2.1' \
            '.. | objects | select(.name? == $name and .version? == $version)' \
            >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Registry version 0.2.1 already exists; publishing will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Registry version 0.2.1 is not visible yet; publishing is required."
          fi

      - name: Install mcp-publisher
        if: steps.registry.outputs.exists != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        id: registry_publish
        continue-on-error: true
        run: ./mcp-publisher publish

      - name: Confirm Registry version 0.2.1
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --get \
              --data-urlencode 'search=io.github.Arthurzxy/vivado-mcp-native' \
              https://registry.modelcontextprotocol.io/v0.1/servers || true)"
            if printf '%s' "$response" | jq -e \
              --arg name 'io.github.Arthurzxy/vivado-mcp-native' \
              --arg version '0.2.1' \
              '.. | objects | select(.name? == $name and .version? == $version)' \
              >/dev/null; then
              echo "MCP Registry version 0.2.1 is available."
              exit 0
            fi
            echo "Waiting for MCP Registry propagation ($attempt/30)..."
            sleep 10
          done
          echo "MCP Registry version 0.2.1 did not become available in time."
          if [ "${{ steps.registry_publish.outcome }}" = "failure" ]; then
            echo "The mcp-publisher command also reported a failure."
          fi
          exit 1

  report:
    name: Report release result
    if: always()
    needs: [build, publish-pypi, publish-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Probe public package and Registry endpoints
        id: probe
        shell: bash
        run: |
          if curl --fail --silent --show-error \
            https://pypi.org/pypi/vivado-mcp-native/0.2.1/json \
            >/dev/null; then
            echo "pypi=visible" >> "$GITHUB_OUTPUT"
          else
            echo "pypi=not-visible" >> "$GITHUB_OUTPUT"
          fi

          response="$(curl --silent --show-error --get \
            --data-urlencode 'search=io.github.Arthurzxy/vivado-mcp-native' \
            https://registry.modelcontextprotocol.io/v0.1/servers || true)"
          if printf '%s' "$response" | jq -e \
            --arg name 'io.github.Arthurzxy/vivado-mcp-native' \
            --arg version '0.2.1' \
            '.. | objects | select(.name? == $name and .version? == $version)' \
            >/dev/null; then
            echo "registry=visible" >> "$GITHUB_OUTPUT"
          else
            echo "registry=not-visible" >> "$GITHUB_OUTPUT"
          fi

      - name: Post result to PR 14
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          PYPI_JOB_RESULT: ${{ needs.publish-pypi.result }}
          REGISTRY_JOB_RESULT: ${{ needs.publish-registry.result }}
          PYPI_VISIBLE: ${{ steps.probe.outputs.pypi }}
          REGISTRY_VISIBLE: ${{ steps.probe.outputs.registry }}
        shell: bash
        run: |
          body=$(cat <<EOF
          ## 0.2.1 release automation result

          - Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Build job: ${BUILD_RESULT}
          - PyPI job: ${PYPI_JOB_RESULT}
          - MCP Registry job: ${REGISTRY_JOB_RESULT}
          - PyPI public endpoint: ${PYPI_VISIBLE}
          - MCP Registry public endpoint: ${REGISTRY_VISIBLE}

          Links:
          - PyPI: https://pypi.org/project/vivado-mcp-native/0.2.1/
          - MCP Registry: https://registry.modelcontextprotocol.io/?q=io.github.Arthurzxy%2Fvivado-mcp-native
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

      - name: Fail when publication is not publicly visible
        if: steps.probe.outputs.pypi != 'visible' || steps.probe.outputs.registry != 'visible'
        run: exit 1
