name: Publish package and MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .release/0.2.1.trigger

concurrency:
  group: package-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify release versions are aligned
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import tomllib

          expected = "0.2.1"
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          server = json.loads(pathlib.Path("server.json").read_text(encoding="utf-8"))
          init_text = pathlib.Path("__init__.py").read_text(encoding="utf-8")
          module_version = re.search(r'__version__\s*=\s*"([^"]+)"', init_text).group(1)

          values = {
              "pyproject": project["project"]["version"],
              "module": module_version,
              "server": server["version"],
              "package": server["packages"][0]["version"],
          }
          if any(value != expected for value in values.values()):
              raise SystemExit(f"Version mismatch: {values}")
          if server["name"] != "io.github.Arthurzxy/vivado-mcp-native":
              raise SystemExit("Unexpected MCP Registry server name")
          print(values)
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/vivado-mcp-native

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-registry:
    name: Publish metadata to official MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for PyPI version 0.2.1
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              https://pypi.org/pypi/vivado-mcp-native/0.2.1/json \
              >/dev/null; then
              echo "PyPI version 0.2.1 is available."
              exit 0
            fi
            echo "Waiting for PyPI propagation ($attempt/30)..."
            sleep 10
          done
          echo "PyPI version 0.2.1 did not become available in time."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
