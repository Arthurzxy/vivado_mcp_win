name: Publish package and MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: package-publish
  cancel-in-progress: false

env:
  DISTRIBUTION_NAME: vivado-mcp-native
  MCP_SERVER_NAME: io.github.Arthurzxy/vivado-mcp-native
  MCP_SERVER_NAME_ENCODED: io.github.Arthurzxy%2Fvivado-mcp-native

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify and export release metadata
        id: metadata
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          server = json.loads(pathlib.Path("server.json").read_text(encoding="utf-8"))
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          init_text = pathlib.Path("__init__.py").read_text(encoding="utf-8")
          module_version = re.search(r'__version__\s*=\s*"([^"]+)"', init_text).group(1)

          distribution = project["project"]["name"]
          version = project["project"]["version"]
          package = server["packages"][0]

          values = {
              "pyproject": version,
              "module": module_version,
              "server": server["version"],
              "package": package["version"],
          }
          if len(set(values.values())) != 1:
              raise SystemExit(f"Version mismatch: {values}")
          if distribution != os.environ["DISTRIBUTION_NAME"]:
              raise SystemExit(f"Unexpected distribution name: {distribution}")
          if server["name"] != os.environ["MCP_SERVER_NAME"]:
              raise SystemExit(f"Unexpected MCP server name: {server['name']}")
          if package["registryType"] != "pypi" or package["identifier"] != distribution:
              raise SystemExit(f"Unexpected Registry package metadata: {package}")
          if f"mcp-name: {server['name']}" not in readme:
              raise SystemExit("README is missing the MCP Registry ownership marker")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(values)
          PY

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: test "${GITHUB_REF_NAME#v}" = "$VERSION"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish package and Registry metadata
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vivado-mcp-native/
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PYPI_VERSION_URL: https://pypi.org/pypi/vivado-mcp-native/${{ needs.build.outputs.version }}/json
      REGISTRY_VERSION_URL: https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Arthurzxy%2Fvivado-mcp-native/versions/${{ needs.build.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether the PyPI version exists
        id: pypi
        shell: bash
        run: |
          if curl --fail --silent --show-error "$PYPI_VERSION_URL" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PyPI version $VERSION already exists; upload will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download distributions
        if: steps.pypi.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Wait for PyPI propagation
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error "$PYPI_VERSION_URL" >/dev/null && exit 0
            echo "Waiting for PyPI propagation ($attempt/30)..."
            sleep 10
          done
          exit 1

      - name: Check whether the MCP Registry version exists
        id: registry
        shell: bash
        run: |
          if curl --path-as-is --fail --silent --show-error "$REGISTRY_VERSION_URL" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "MCP Registry version $VERSION already exists; publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.registry.outputs.exists != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher publish

      - name: Wait for MCP Registry propagation
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            curl --path-as-is --fail --silent --show-error "$REGISTRY_VERSION_URL" >/dev/null && exit 0
            echo "Waiting for MCP Registry propagation ($attempt/30)..."
            sleep 10
          done
          exit 1

  verify-publication:
    name: Verify public endpoints
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PYPI_VERSION_URL: https://pypi.org/pypi/vivado-mcp-native/${{ needs.build.outputs.version }}/json
      REGISTRY_VERSION_URL: https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Arthurzxy%2Fvivado-mcp-native/versions/${{ needs.build.outputs.version }}

    steps:
      - name: Verify PyPI version
        run: curl --fail --silent --show-error "$PYPI_VERSION_URL" >/dev/null

      - name: Verify official MCP Registry version
        run: curl --path-as-is --fail --silent --show-error "$REGISTRY_VERSION_URL" >/dev/null

      - name: Print publication links
        run: |
          echo "PyPI: https://pypi.org/project/vivado-mcp-native/${VERSION}/"
          echo "MCP Registry: https://registry.modelcontextprotocol.io/?q=io.github.Arthurzxy%2Fvivado-mcp-native"
