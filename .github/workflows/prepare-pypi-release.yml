name: verify-pypi-package

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/prepare-pypi-release.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          rm -rf dist build *.egg-info
          python -m build
          python -m twine check --strict dist/*

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/package-check"
          "$RUNNER_TEMP/package-check/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/package-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/package-check/bin/vivado-mcp-native-doctor" --help
          "$RUNNER_TEMP/package-check/bin/python" - <<'PY'
          import importlib.metadata
          import json
          import pathlib
          import vivado_mcp

          distribution = importlib.metadata.distribution("vivado-mcp-native")
          console_scripts = sorted(
              entry.name
              for entry in distribution.entry_points
              if entry.group == "console_scripts"
          )
          expected = {
              "vivado-mcp-native",
              "vivado-mcp-native-doctor",
              "vivado-mcp-win",
              "vivado-mcp-win-doctor",
          }
          missing = sorted(expected.difference(console_scripts))
          result = {
              "success": not missing,
              "distribution": distribution.metadata["Name"],
              "version": distribution.version,
              "module_version": vivado_mcp.__version__,
              "console_scripts": console_scripts,
              "missing_console_scripts": missing,
          }
          pathlib.Path("pypi-package-check.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          if missing:
              raise SystemExit(f"Missing console scripts: {missing}")
          PY

      - name: Record verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pypi-package-check.json
          git commit -m "Record PyPI package verification" || exit 0
          git push origin dev
