name: real-vivado-e2e-pr-trigger

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - .github/real-vivado-trigger

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e:
    if: >-
      github.actor == 'Arthurzxy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'chore/real-vivado-trigger-')
    runs-on: [self-hosted, Windows, X64, vivado]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/windows-native-support

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve Vivado 2025.2.1 launcher
        id: vivado
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            $env:VIVADO_PATH,
            "D:\Software\Xilinx\2025.2.1\Vivado\bin\vivado.bat"
          ) | Where-Object { $_ }

          $resolved = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $resolved = (Resolve-Path -LiteralPath $candidate).Path
              break
            }
          }

          if (-not $resolved) {
            throw "Vivado 2025.2.1 launcher was not found."
          }

          "vivado_path=$resolved" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using Vivado launcher: $resolved"

      - name: Run persistent-session and synthesis validation
        shell: pwsh
        env:
          RESOLVED_VIVADO_PATH: ${{ steps.vivado.outputs.vivado_path }}
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP "vivado-mcp-real-e2e-$env:GITHUB_RUN_ID"
          & python tests/real_vivado_e2e.py `
            --vivado-path $env:RESOLVED_VIVADO_PATH `
            --output vivado-real-e2e.json `
            --work-root $workRoot `
            --part xc7k325tffg900-2 2>&1 |
            Tee-Object vivado-real-e2e.log

          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Upload end-to-end report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivado-real-e2e-${{ github.run_id }}
          path: |
            vivado-real-e2e.json
            vivado-real-e2e.log
          if-no-files-found: warn
