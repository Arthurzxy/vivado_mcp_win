name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  fix-windows-quoting:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/windows-native-support
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply quoting fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          session_path = Path("vivado_session.py")
          session_text = session_path.read_text(encoding="utf-8")
          old_session = '''def build_launch_command(
              executable: str,
              *,
              platform_name: str | None = None,
              comspec: str | None = None,
          ) -> list[str]:
              """Build the platform-specific subprocess command.

              ``platform_name`` exists primarily so CI can test Windows command building
              while running on Linux.
              """

              platform_name = platform_name or os.name
              args = [executable, "-mode", "tcl", "-nojournal", "-nolog"]
              suffix = Path(executable).suffix.lower()
              if platform_name == "nt" and suffix in {".bat", ".cmd"}:
                  shell = comspec or os.environ.get("COMSPEC", "cmd.exe")
                  quoted = subprocess.list2cmdline(args)
                  return [shell, "/d", "/s", "/c", f"call {quoted}"]
              return args
          '''
          new_session = '''def build_launch_command(
              executable: str,
              *,
              platform_name: str | None = None,
              comspec: str | None = None,
          ) -> str | list[str]:
              """Build the platform-specific subprocess command.

              ``platform_name`` exists primarily so CI can test Windows command building
              while running on Linux. Windows batch launchers require a single command-line
              string so Python does not escape the nested quotes as literal backslashes.
              """

              platform_name = platform_name or os.name
              args = [executable, "-mode", "tcl", "-nojournal", "-nolog"]
              suffix = Path(executable).suffix.lower()
              if platform_name == "nt" and suffix in {".bat", ".cmd"}:
                  shell = comspec or os.environ.get("COMSPEC", "cmd.exe")
                  shell_command = subprocess.list2cmdline([shell])
                  batch_command = subprocess.list2cmdline(args)
                  return f'{shell_command} /d /s /c "{batch_command}"'
              return args
          '''
          if old_session in session_text:
              session_path.write_text(
                  session_text.replace(old_session, new_session), encoding="utf-8"
              )
          elif new_session not in session_text:
              raise SystemExit("Neither the original nor fixed launch block was found")

          test_path = Path("tests/test_vivado_session.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_test = '''    assert command[:4] == [
                  r"C:\\Windows\\System32\\cmd.exe",
                  "/d",
                  "/s",
                  "/c",
              ]
              assert "call" in command[4]
              assert "vivado.bat" in command[4]
              assert "-mode tcl" in command[4]
          '''
          new_test = '''    assert isinstance(command, str)
              assert command.startswith(r"C:\\Windows\\System32\\cmd.exe /d /s /c ")
              assert command.endswith('"')
              assert '"C:\\Xilinx\\Vivado\\2025.2\\bin\\vivado.bat"' in command
              assert "-mode tcl" in command
          '''
          if old_test in test_text:
              test_path.write_text(test_text.replace(old_test, new_test), encoding="utf-8")
          elif new_test not in test_text:
              raise SystemExit("Neither the original nor fixed command test was found")
          '@ | python -
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q .
      - run: python -m pytest -q
      - run: python -m ruff check vivado_session.py doctor.py tests
      - name: Commit verified fix
        shell: pwsh
        run: |
          git add vivado_session.py tests/test_vivado_session.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Windows quoting fix is already applied."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Windows batch launcher quoting"
          git push origin HEAD:agent/windows-native-support

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q .
      - run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip ruff
      - name: Run Ruff
        id: ruff
        shell: bash
        run: |
          set +e
          python -m ruff check vivado_session.py doctor.py tests --output-format=concise 2>&1 | tee ruff-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.txt
      - name: Fail on Ruff errors
        if: steps.ruff.outputs.exit_code != '0'
        run: exit 1

  package-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python tests/package_smoke.py dist
