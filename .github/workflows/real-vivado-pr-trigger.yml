name: real-vivado-pr-trigger

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - .github/real-vivado-trigger

permissions:
  contents: read
  pull-requests: read

jobs:
  smoke:
    if: >-
      github.actor == 'Arthurzxy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'chore/real-vivado-trigger-')
    runs-on: [self-hosted, Windows, X64, vivado]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/windows-native-support

      - name: Discover installed Vivado
        id: discover
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $records = [System.Collections.Generic.List[object]]::new()
          $searchLog = [System.Collections.Generic.List[string]]::new()

          function Get-VersionScore {
            param([string]$Path)
            $matches = [regex]::Matches($Path, '(?<!\d)(20\d{2})\.(\d+)(?:\.(\d+))?')
            if ($matches.Count -eq 0) { return [long]0 }
            $match = $matches[$matches.Count - 1]
            $year = [long]$match.Groups[1].Value
            $minor = [long]$match.Groups[2].Value
            $patch = if ($match.Groups[3].Success) { [long]$match.Groups[3].Value } else { [long]0 }
            return ($year * 10000L) + ($minor * 100L) + $patch
          }

          function Get-CandidateScore {
            param([string]$Path, [string]$Source)
            if ($Path -match '(?i)\\MATLAB\\|hdlverifier|dpigenerator|\\makefiles\\') {
              return [long]-1
            }

            $score = [long]0
            if ($Path -match '(?i)\\Vivado\\bin\\vivado\.(bat|cmd|exe)$') {
              $score += 1000000000L
            }
            if ($Path -match '(?i)\\(Xilinx|AMD)\\') {
              $score += 100000000L
            }
            $score += (Get-VersionScore $Path) * 100L

            if ($Source -like 'environment:*') { $score += 40L }
            elseif ($Source -like 'PATH:*') { $score += 30L }
            elseif ($Source -like 'registry:*') { $score += 20L }
            elseif ($Source -like 'common-layout:*') { $score += 10L }

            return $score
          }

          function Add-Candidate {
            param([string]$Path, [string]$Source)
            if (-not $Path) { return }
            $cleanPath = $Path.Trim().Trim('"')
            if (-not (Test-Path -LiteralPath $cleanPath -PathType Leaf)) { return }
            $resolved = (Resolve-Path -LiteralPath $cleanPath).Path
            $score = Get-CandidateScore $resolved $Source
            if ($score -lt 0) {
              $searchLog.Add("Rejected non-launcher wrapper: $resolved")
              return
            }
            if (-not ($records.path -contains $resolved)) {
              $records.Add([pscustomobject]@{
                path = $resolved
                source = $Source
                version_score = Get-VersionScore $resolved
                score = $score
              })
              Write-Host "Found Vivado candidate: $resolved ($Source, score=$score)"
            }
          }

          function Add-InstallationRoot {
            param([string]$Root, [string]$Source)
            if (-not $Root) { return }
            $cleanRoot = $Root.Trim().Trim('"')
            if (-not (Test-Path -LiteralPath $cleanRoot -PathType Container)) { return }
            Add-Candidate (Join-Path $cleanRoot "vivado.bat") $Source
            Add-Candidate (Join-Path $cleanRoot "bin\vivado.bat") $Source
            Add-Candidate (Join-Path $cleanRoot "Vivado\bin\vivado.bat") $Source
          }

          foreach ($variableName in @("VIVADO_PATH", "XILINX_VIVADO", "XILINX_VITIS")) {
            $value = [Environment]::GetEnvironmentVariable($variableName)
            if ($value) {
              $searchLog.Add("Environment variable ${variableName} is set")
              Add-Candidate $value "environment:$variableName"
              Add-InstallationRoot $value "environment:$variableName"
            }
          }

          foreach ($name in @("vivado.bat", "vivado.cmd", "vivado.exe", "vivado")) {
            $command = Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($command) {
              Add-Candidate $command.Source "PATH:$name"
            }
          }

          $uninstallRegistryPaths = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          foreach ($registryPath in $uninstallRegistryPaths) {
            foreach ($entry in Get-ItemProperty -Path $registryPath -ErrorAction SilentlyContinue) {
              if ($entry.DisplayName -match "(?i)(Vivado|Xilinx.*Design|AMD.*Vivado)") {
                $searchLog.Add("Registry entry: $($entry.DisplayName)")
                Add-InstallationRoot $entry.InstallLocation "registry:$($entry.DisplayName)"
              }
            }
          }

          $relativePatterns = @(
            "Xilinx\Vivado\*\bin\vivado.bat",
            "Xilinx\*\Vivado\bin\vivado.bat",
            "AMD\Vivado\*\bin\vivado.bat",
            "AMD\*\Vivado\bin\vivado.bat",
            "Program Files\Xilinx\Vivado\*\bin\vivado.bat",
            "Program Files\Xilinx\*\Vivado\bin\vivado.bat",
            "Program Files\AMD\Vivado\*\bin\vivado.bat",
            "Program Files\AMD\*\Vivado\bin\vivado.bat",
            "tools\Xilinx\Vivado\*\bin\vivado.bat",
            "tools\AMD\Vivado\*\bin\vivado.bat"
          )

          $drives = Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Root -match "^[A-Za-z]:\\$" }

          foreach ($drive in $drives) {
            $searchLog.Add("File-system drive: $($drive.Root)")
            foreach ($relativePattern in $relativePatterns) {
              $pattern = Join-Path $drive.Root $relativePattern
              foreach ($file in Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue) {
                Add-Candidate $file.FullName "common-layout:$relativePattern"
              }
            }
          }

          if ($records.Count -eq 0) {
            foreach ($drive in $drives) {
              $topLevelDirectories = Get-ChildItem -LiteralPath $drive.Root -Directory -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match "(?i)(xilinx|amd|vivado|fpga|eda|tool|soft|app|program)" }

              foreach ($directory in $topLevelDirectories) {
                $searchLog.Add("Recursive candidate root: $($directory.FullName)")
                foreach ($file in Get-ChildItem -LiteralPath $directory.FullName -Filter vivado.bat -File -Recurse -Depth 8 -ErrorAction SilentlyContinue) {
                  Add-Candidate $file.FullName "recursive-candidate-root"
                }
              }
            }
          }

          if ($records.Count -eq 0) {
            foreach ($drive in $drives) {
              $searchLog.Add("Full-drive where.exe search: $($drive.Root)")
              $matches = & where.exe /R $drive.Root vivado.bat 2>$null
              foreach ($match in @($matches)) {
                Add-Candidate $match "full-drive-where"
              }
            }
          }

          $preferred = $records |
            Sort-Object -Property @{Expression='score'; Descending=$true}, @{Expression='path'; Descending=$true} |
            Select-Object -First 1

          $discovery = [ordered]@{
            resolved_vivado_path = if ($preferred) { $preferred.path } else { $null }
            selected_score = if ($preferred) { $preferred.score } else { $null }
            candidate_count = $records.Count
            candidates = @($records)
            search_log = @($searchLog)
            runner_name = $env:RUNNER_NAME
            machine_name = $env:COMPUTERNAME
            tested_ref = "agent/windows-native-support"
          }
          $discovery |
            ConvertTo-Json -Depth 6 |
            Set-Content vivado-discovery.json -Encoding utf8

          Get-Content vivado-discovery.json

          if (-not $preferred) {
            throw "No real Vivado launcher was found."
          }

          "vivado_path=$($preferred.path)" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Selected Vivado launcher: $($preferred.path)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run diagnostics directly from checked-out source
        shell: pwsh
        env:
          RESOLVED_VIVADO_PATH: ${{ steps.discover.outputs.vivado_path }}
        run: |
          $bootstrap = Join-Path $env:RUNNER_TEMP "run_vivado_doctor_from_source.py"
          @'
          import os
          import pathlib
          import runpy
          import sys
          import types
          import typing

          root = pathlib.Path.cwd()

          try:
              import typing_extensions  # noqa: F401
          except ImportError:
              compatibility = types.ModuleType("typing_extensions")
              compatibility.Self = typing.Self
              sys.modules["typing_extensions"] = compatibility

          package = types.ModuleType("vivado_mcp")
          package.__path__ = [str(root)]
          package.__package__ = "vivado_mcp"
          sys.modules["vivado_mcp"] = package

          sys.argv = [
              "vivado-mcp-win-doctor",
              "--vivado-path",
              os.environ["RESOLVED_VIVADO_PATH"],
              "--timeout",
              "300",
              "--json",
          ]
          runpy.run_module("vivado_mcp.doctor", run_name="__main__")
          '@ | Set-Content -Path $bootstrap -Encoding utf8

          & python $bootstrap 2>&1 | Tee-Object vivado-doctor.json
          $doctorExitCode = $LASTEXITCODE
          if ($doctorExitCode -ne 0) {
            exit $doctorExitCode
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivado-doctor-windows-pr-${{ github.run_id }}
          path: |
            vivado-discovery.json
            vivado-doctor.json
          if-no-files-found: warn
