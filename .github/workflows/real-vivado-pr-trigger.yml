name: real-vivado-pr-trigger

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - .github/real-vivado-trigger

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  acknowledge:
    if: >-
      github.actor == 'Arthurzxy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'chore/real-vivado-trigger-')
    runs-on: ubuntu-latest
    steps:
      - name: Report accepted trigger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          payload = {
              "body": (
                  "Restricted PR trigger accepted for the real Vivado smoke test.\n\n"
                  f"- Run: {run_url}\n"
                  "- Tested ref: `agent/windows-native-support`\n"
                  "- Runner: `vivado-win-01`"
              )
          }
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/issues/1/comments",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              print(response.status)
          PY

  smoke:
    if: >-
      github.actor == 'Arthurzxy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'chore/real-vivado-trigger-')
    runs-on: [self-hosted, Windows, X64, vivado]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/windows-native-support

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install .

      - name: Discover installed Vivado
        id: discover
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $records = [System.Collections.Generic.List[object]]::new()

          function Add-Candidate {
            param([string]$Path, [string]$Source)
            if (-not $Path) { return }
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return }
            $resolved = (Resolve-Path -LiteralPath $Path).Path
            if (-not ($records.path -contains $resolved)) {
              $records.Add([pscustomobject]@{
                path = $resolved
                source = $Source
              })
            }
          }

          foreach ($name in @("vivado.bat", "vivado.cmd", "vivado.exe", "vivado")) {
            $command = Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($command) {
              Add-Candidate $command.Source "PATH:$name"
            }
          }

          $relativePatterns = @(
            "Xilinx\Vivado\*\bin\vivado.bat",
            "Xilinx\*\Vivado\bin\vivado.bat",
            "AMD\Vivado\*\bin\vivado.bat",
            "AMD\*\Vivado\bin\vivado.bat",
            "Program Files\Xilinx\Vivado\*\bin\vivado.bat",
            "Program Files\Xilinx\*\Vivado\bin\vivado.bat",
            "Program Files\AMD\Vivado\*\bin\vivado.bat",
            "Program Files\AMD\*\Vivado\bin\vivado.bat",
            "tools\Xilinx\Vivado\*\bin\vivado.bat",
            "tools\AMD\Vivado\*\bin\vivado.bat"
          )

          $drives = Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Root -match "^[A-Za-z]:\\$" }

          foreach ($drive in $drives) {
            foreach ($relativePattern in $relativePatterns) {
              $pattern = Join-Path $drive.Root $relativePattern
              foreach ($file in Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue) {
                Add-Candidate $file.FullName "common_installation_layout"
              }
            }
          }

          $preferred = $records |
            Sort-Object path -Descending |
            Select-Object -First 1

          $discovery = [ordered]@{
            resolved_vivado_path = if ($preferred) { $preferred.path } else { $null }
            candidate_count = $records.Count
            candidates = @($records)
            runner_name = $env:RUNNER_NAME
            tested_ref = "agent/windows-native-support"
          }
          $discovery |
            ConvertTo-Json -Depth 5 |
            Set-Content vivado-discovery.json -Encoding utf8

          Get-Content vivado-discovery.json

          if (-not $preferred) {
            throw "No Vivado launcher was found in PATH or common installation layouts."
          }

          "vivado_path=$($preferred.path)" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Selected Vivado launcher: $($preferred.path)"

      - name: Run diagnostics against installed Vivado
        shell: pwsh
        env:
          RESOLVED_VIVADO_PATH: ${{ steps.discover.outputs.vivado_path }}
        run: |
          & vivado-mcp-win-doctor `
            --vivado-path $env:RESOLVED_VIVADO_PATH `
            --timeout 300 `
            --json 2>&1 |
            Tee-Object vivado-doctor.json

          $doctorExitCode = $LASTEXITCODE
          if ($doctorExitCode -ne 0) {
            exit $doctorExitCode
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivado-doctor-windows-pr-${{ github.run_id }}
          path: |
            vivado-discovery.json
            vivado-doctor.json
          if-no-files-found: warn

      - name: Report result to PR 1
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $resolved = "not found"
          $candidateCount = 0
          $doctorSuccess = "not run"

          if (Test-Path vivado-discovery.json) {
            $discovery = Get-Content vivado-discovery.json -Raw | ConvertFrom-Json
            if ($discovery.resolved_vivado_path) {
              $resolved = $discovery.resolved_vivado_path
            }
            $candidateCount = $discovery.candidate_count
          }

          if (Test-Path vivado-doctor.json) {
            try {
              $doctor = Get-Content vivado-doctor.json -Raw | ConvertFrom-Json
              $doctorSuccess = [string]$doctor.success
            }
            catch {
              $doctorSuccess = "invalid JSON"
            }
          }

          $body = @"
          Real Vivado smoke run completed.

          - Run: $runUrl
          - Tested ref: agent/windows-native-support
          - Resolved launcher: $resolved
          - Candidates found: $candidateCount
          - Doctor success: $doctorSuccess

          Full diagnostics are in the workflow artifact.
          "@

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $payload = @{ body = $body } | ConvertTo-Json
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/issues/1/comments"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Body $payload -ContentType "application/json"
