name: one-time-repository-cleanup

on:
  push:
    branches: [master]
    paths:
      - .github/branch-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Update README files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("# Vivado MCP\n", "# Vivado MCP Native\n", 1)
          if "[简体中文](README.zh-CN.md)" not in "\n".join(text.splitlines()[:8]):
              text = text.replace(
                  "# Vivado MCP Native\n",
                  "# Vivado MCP Native\n\n**English** | [简体中文](README.zh-CN.md)\n",
                  1,
              )
          text = text.replace("This fork uses", "This project uses")
          text = text.replace("Arthurzxy/vivado_mcp_win", "Arthurzxy/vivado_mcp_native")
          readme.write_text(text, encoding="utf-8")

          readme_cn = Path("README.zh-CN.md")
          text_cn = readme_cn.read_text(encoding="utf-8")
          text_cn = text_cn.replace("# Vivado MCP\n", "# Vivado MCP Native\n", 1)
          text_cn = text_cn.replace("Arthurzxy/vivado_mcp_win", "Arthurzxy/vivado_mcp_native")
          if "[English](README.md)" not in "\n".join(text_cn.splitlines()[:8]):
              text_cn = text_cn.replace(
                  "# Vivado MCP Native\n",
                  "# Vivado MCP Native\n\n[English](README.md) | **简体中文**\n",
                  1,
              )
          readme_cn.write_text(text_cn, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          if ! git diff --cached --quiet; then
            git commit -m "Update README for vivado_mcp_native"
            git push origin HEAD:master
          fi

      - name: Keep only master and dev branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def request(method, path, data=None):
              body = None if data is None else json.dumps(data).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repo}/{path}",
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      payload = response.read()
                      return response.status, json.loads(payload) if payload else None
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} failed: HTTP {exc.code}: {payload}") from exc

          _, master_ref = request("GET", "git/ref/heads/master")
          master_sha = master_ref["object"]["sha"]

          dev_created = False
          try:
              request("GET", "git/ref/heads/dev")
          except RuntimeError as exc:
              if "HTTP 404" not in str(exc):
                  raise
              request("POST", "git/refs", {"ref": "refs/heads/dev", "sha": master_sha})
              dev_created = True

          branches = []
          page = 1
          while True:
              _, batch = request("GET", f"branches?per_page=100&page={page}")
              if not batch:
                  break
              branches.extend(item["name"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          kept = []
          deleted = []
          failed = []
          for branch in branches:
              if branch in {"master", "dev"}:
                  kept.append(branch)
                  continue
              encoded = urllib.parse.quote(branch, safe="")
              try:
                  request("DELETE", f"git/refs/heads/{encoded}")
                  deleted.append(branch)
              except Exception as exc:
                  failed.append({"branch": branch, "error": str(exc)})

          result = {
              "master_sha_after_readme_update": master_sha,
              "dev_created": dev_created,
              "branches_seen": branches,
              "kept": sorted(kept),
              "deleted": sorted(deleted),
              "failed": failed,
              "success": not failed,
          }
          Path(".github/branch-cleanup-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if failed:
              raise SystemExit(1)
          PY

          git add .github/branch-cleanup-result.json
          git commit -m "Record branch cleanup result"
          git push origin HEAD:master
